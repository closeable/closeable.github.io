<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>霓虹贪吃蛇</title>
<style>
  :root {
    --bg: #f7f8fc; --surface: #ffffff; --border: #e6e9f0;
    --text: #1c2233; --muted: #8892a4;
    --accent: #5b5bd6; --accent2: #0ea5b7; --food: #f43f5e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0e111a; --surface: #171c28; --border: #2a3141;
      --text: #e8ebf3; --muted: #8b95a8;
      --accent: #9b9bff; --accent2: #4dd0d8; --food: #fb7185;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0e111a; --surface: #171c28; --border: #2a3141;
    --text: #e8ebf3; --muted: #8b95a8;
    --accent: #9b9bff; --accent2: #4dd0d8; --food: #fb7185;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  .hud {
    display: flex; gap: 24px; font-size: 15px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border);
    padding: 8px 20px; border-radius: 12px;
  }
  .hud span { color: var(--muted); font-weight: 500; margin-right: 6px; }
  .stage { position: relative; }
  canvas {
    display: block; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 40px rgba(31, 41, 79, 0.10);
    max-width: 100%; max-height: 100%;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: blur(6px); border-radius: 14px;
    text-align: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; letter-spacing: -.02em; }
  .overlay p { color: var(--muted); font-size: 14px; line-height: 1.7; }
  .btn {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px;
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 10px 28px; border-radius: 12px;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .btn:active { transform: scale(.97); }
  .tip { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="hud">
    <div><span>得分</span><b id="score">0</b></div>
    <div><span>最高分</span><b id="best">0</b></div>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">🐍 霓虹贪吃蛇</h2>
      <p id="ov-text">方向键 / WASD 控制方向<br>手机上滑动屏幕即可转向</p>
      <button class="btn" id="start-btn">开始游戏</button>
    </div>
  </div>
  <div class="tip">按 P 或点击画布暂停</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const startBtn = document.getElementById('start-btn');

  const GRID = 24;
  const CELL = cv.width / GRID;
  const BEST_KEY = 'snake-best';

  let snake, dir, nextDir, food, score, best, alive, running, timer;
  best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  // 自适应画布尺寸（正方形，跟随容器）
  function fit() {
    const max = Math.min(window.innerWidth - 24, window.innerHeight - 120, 560);
    cv.style.width = max + 'px';
    cv.style.height = max + 'px';
  }
  window.addEventListener('resize', fit); fit();

  function reset() {
    snake = [{x: 11, y: 12}, {x: 10, y: 12}, {x: 9, y: 12}];
    dir = {x: 1, y: 0}; nextDir = dir;
    score = 0; alive = true;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function tick() {
    if (!running || !alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem(BEST_KEY, best); }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    // 网格底纹
    ctx.fillStyle = css('--surface');
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = css('--border');
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cv.width, i * CELL); ctx.stroke();
    }
    // 食物
    ctx.fillStyle = css('--food');
    ctx.shadowColor = css('--food'); ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 蛇身
    snake.forEach((s, i) => {
      const t = 1 - i / (snake.length + 3);
      ctx.fillStyle = i === 0 ? css('--accent') : colorMix(css('--accent'), css('--accent2'), i / Math.max(snake.length, 1));
      ctx.globalAlpha = 0.45 + 0.55 * t;
      roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, i === 0 ? 7 : 5);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function colorMix(a, b, t) {
    const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
    const m = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
    return `rgb(${m[0]},${m[1]},${m[2]})`;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function gameOver() {
    alive = false; clearInterval(timer);
    ovTitle.textContent = '💀 游戏结束';
    ovText.innerHTML = `本局得分 <b>${score}</b> · 最高分 <b>${best}</b><br>再接再厉！`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function start() {
    reset(); draw();
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(tick, 110);
    running = true;
  }

  function togglePause() {
    if (!alive) return;
    running = !running;
    if (running) {
      overlay.classList.add('hidden');
      timer = setInterval(tick, 110);
    } else {
      clearInterval(timer);
      ovTitle.textContent = '⏸ 已暂停';
      ovText.textContent = '点击继续按钮回到游戏';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    }
  }

  function setDir(x, y) {
    if (!running) return;
    if (dir.x === -x && dir.y === -y) return; // 不能直接掉头
    nextDir = {x, y};
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'w'].includes(k)) { e.preventDefault(); setDir(0, -1); }
    else if (['arrowdown', 's'].includes(k)) { e.preventDefault(); setDir(0, 1); }
    else if (['arrowleft', 'a'].includes(k)) { e.preventDefault(); setDir(-1, 0); }
    else if (['arrowright', 'd'].includes(k)) { e.preventDefault(); setDir(1, 0); }
    else if (k === 'p') togglePause();
  });

  // 触屏滑动
  let tx = 0, ty = 0;
  cv.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
  cv.addEventListener('touchmove', (e) => e.preventDefault(), {passive: false});
  cv.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  });

  startBtn.addEventListener('click', () => {
    if (alive && !running) togglePause(); else start();
  });
  cv.addEventListener('click', () => { if (alive && running) togglePause(); });

  // 初始画面
  reset(); running = false; draw();

  // 跟随宿主站点主题（父页面会通过 postMessage 下发）
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'theme') {
      document.documentElement.dataset.theme = e.data.theme;
      draw();
    }
  });
})();
</script>
</body>
</html>
