<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>霓虹五子棋</title>
<style>
  :root {
    --bg: #f4f6fb; --surface: #ffffff; --surface2: #eef1f7;
    --border: #d9dfe9; --text: #1c2330; --muted: #6b7688;
    --accent: #5b5bd6; --accent2: #0ea5b7; --danger: #e5484d;
    --gold: #d97706;
    --stone-black-hi: #4d5872; --stone-black-mid: #1b2130; --stone-black-lo: #05070d;
    --stone-white-hi: #ffffff; --stone-white-mid: #f3f6fb; --stone-white-lo: #c6cedd;
    --board: #e6dabe; --board-hi: #fdf8ec; --board-lo: #c6b083; --grid: #7b6844;
    --veil: rgba(24, 28, 38, .20);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0e111a; --surface: #171c28; --surface2: #1e2432;
      --border: #2a3141; --text: #e8ebf3; --muted: #8b95a8;
      --accent: #9b9bff; --accent2: #4dd0d8; --danger: #fb7185;
      --gold: #fbbf24;
      --stone-black-hi: #6a7799; --stone-black-mid: #262e40; --stone-black-lo: #090d16;
      --stone-white-hi: #f4f7fc; --stone-white-mid: #e9eef7; --stone-white-lo: #aab4c7;
      --board: #151a25; --board-hi: #2a3346; --board-lo: #080b11; --grid: #55648a;
    --veil: rgba(6, 8, 14, .52);
    }
  }
  :root[data-theme='dark'] {
    --bg: #0e111a; --surface: #171c28; --surface2: #1e2432;
    --border: #2a3141; --text: #e8ebf3; --muted: #8b95a8;
    --accent: #9b9bff; --accent2: #4dd0d8; --danger: #fb7185;
    --gold: #fbbf24;
    --stone-black-hi: #6a7799; --stone-black-mid: #262e40; --stone-black-lo: #090d16;
    --stone-white-hi: #f4f7fc; --stone-white-mid: #e9eef7; --stone-white-lo: #aab4c7;
    --board: #151a25; --board-hi: #2a3346; --board-lo: #080b11; --grid: #55648a;
    --veil: rgba(6, 8, 14, .52);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 10px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-tap-highlight-color: transparent; overflow: hidden;
  }
  .hud {
    display: flex; align-items: center; gap: 8px; width: 100%;
    max-width: 640px; font-size: 13px; color: var(--muted);
  }
  .hud .pill {
    padding: 5px 12px; border-radius: 999px; font-weight: 600; font-size: 13px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    white-space: nowrap;
  }
  .hud .pill.turn-ai { color: var(--accent); border-color: var(--accent); }
  .hud .grow { flex: 1; }
  .hud button {
    padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    cursor: pointer; transition: transform .12s ease, box-shadow .12s ease;
  }
  .hud button:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  .hud button:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
  canvas {
    display: block; border-radius: 16px; cursor: pointer;
    box-shadow: 0 18px 42px rgba(12, 16, 28, .26), 0 3px 8px rgba(12, 16, 28, .14);
  }
  .tip { font-size: 12px; color: var(--muted); }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--veil, rgba(10, 12, 20, .55)); backdrop-filter: blur(4px) saturate(1.02);
    border-radius: 14px; z-index: 5;
  }
  #overlay.hidden { display: none; }
  .card {
    width: min(78%, 340px); text-align: center; padding: 26px 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .card .badge { font-size: 40px; line-height: 1; margin-bottom: 10px; }
  .card h2 {
    font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card h2.lose { background: linear-gradient(90deg, var(--danger), var(--gold)); -webkit-background-clip: text; background-clip: text; }
  .card p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
  .card .stats { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .card .stats span {
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  .btns button {
    padding: 11px 16px; border-radius: 12px; font-size: 15px; font-weight: 700;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    cursor: pointer; transition: transform .12s ease, box-shadow .12s ease;
  }
  .btns button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.2); }
  .btns button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none;
  }
  .diff-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 4px; }
  .rec-row { display: flex; gap: 8px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
  @media (max-height: 560px) {
    .tip { display: none; }
    body { gap: 6px; padding: 6px; }
    .card { padding: 16px 14px; border-radius: 14px; }
    .card .badge { font-size: 28px; margin-bottom: 4px; }
    .card h2 { font-size: 19px; margin-bottom: 4px; }
    .card p { font-size: 12px; margin-bottom: 10px; line-height: 1.55; }
    .card .stats { margin-bottom: 10px; }
    .btns { gap: 6px; }
    .btns button { padding: 9px 12px; font-size: 14px; border-radius: 10px; }
  }
</style>
</head>
<body>
  <div class="hud">
    <span class="pill" id="status">执黑先行</span>
    <span class="grow"></span>
    <button id="undo-btn" disabled>↩ 悔棋</button>
    <button id="music-btn" title="背景音乐">🎵</button>
    <button id="mute-btn" title="音效">🔊</button>
  </div>
  <div style="position:relative">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div class="card" id="card-start">
        <div class="badge">⚫</div>
        <h2>霓虹五子棋</h2>
        <p>你执黑先行，AI 执白。<br>先连成五子者胜。</p>
        <div class="btns">
          <button data-diff="easy">🍵 简单 · 新手热身</button>
          <button data-diff="medium" class="primary">⚔️ 中等 · 会攻防</button>
          <button data-diff="hard">🔥 困难 · 算路很深</button>
          <button data-diff="master">🏆 大师 · 会算杀</button>
        </div>
        <div class="rec-row" id="rec-row"></div>
      </div>
      <div class="card" id="card-over" style="display:none">
        <div class="badge" id="ov-badge">🎉</div>
        <h2 id="ov-title">你赢了！</h2>
        <p id="ov-text"></p>
        <div class="stats" id="ov-stats"></div>
        <div class="btns">
          <button id="again-btn" class="primary">再来一局</button>
          <button id="rediff-btn">换个难度</button>
        </div>
      </div>
    </div>
  </div>
  <div class="tip">点击棋盘落子 · AI 思考时请稍候 · 悔棋会撤回你和 AI 各一手</div>

<script>
(() => {
  'use strict';
  const N = 15, EMPTY = 0, BLACK = 1, WHITE = 2;
  const ME = BLACK, AI = WHITE;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const statusEl = document.getElementById('status');
  const undoBtn = document.getElementById('undo-btn');
  const muteBtn = document.getElementById('mute-btn');
  const musicBtn = document.getElementById('music-btn');
  const overlay = document.getElementById('overlay');
  const cardStart = document.getElementById('card-start');
  const cardOver = document.getElementById('card-over');
  const ovBadge = document.getElementById('ov-badge');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const ovStats = document.getElementById('ov-stats');
  const recRow = document.getElementById('rec-row');
  const againBtn = document.getElementById('again-btn');
  const rediffBtn = document.getElementById('rediff-btn');

  // ---------- 状态 ----------
  let board = new Uint8Array(N * N);
  let nearCnt = new Uint16Array(N * N);   // 每格周围 5x5 范围内的棋子数，用于快速生成候选点
  let history = [];               // {x,y,p}
  let state = 'idle';             // idle | human | thinking | over
  let diff = 'medium';
  let winLine = null;             // 胜利五连坐标
  let lastMove = null;
  let hover = null;
  let record = { w: 0, l: 0, d: 0 };
  try { record = JSON.parse(localStorage.getItem('gomoku-record')) || record; } catch (e) {}
  let mute = localStorage.getItem('gomoku-mute') === '1';

  // ---------- 主题 ----------
  let C = {};
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function refreshColors() {
    C = {
      bg: cssVar('--bg'), surface: cssVar('--surface'), border: cssVar('--border'),
      text: cssVar('--text'), muted: cssVar('--muted'),
      accent: cssVar('--accent'), accent2: cssVar('--accent2'), danger: cssVar('--danger'),
      board: cssVar('--board'), boardHi: cssVar('--board-hi'), boardLo: cssVar('--board-lo'), grid: cssVar('--grid'),
      bh: cssVar('--stone-black-hi'), bm: cssVar('--stone-black-mid'), bl: cssVar('--stone-black-lo'),
      wh: cssVar('--stone-white-hi'), wm: cssVar('--stone-white-mid'), wl: cssVar('--stone-white-lo'),
    };
    if (state !== 'idle') draw();
  }
  window.addEventListener('message', (e) => {
    if (e && e.data && e.data.type === 'theme') {
      document.documentElement.dataset.theme = e.data.theme;
      refreshColors();
    }
  });
  refreshColors();
  window.__syncArt = refreshColors;

  // ---------- 画布 ----------
  let SIZE = 560, PAD = 26, CELL = 36, dpr = 1;
  function fit() {
    const narrow = window.innerWidth < 520;
    const maxW = Math.min(window.innerWidth - (narrow ? 12 : 24), 640);
    const maxH = window.innerHeight - (narrow ? 92 : 100);
    SIZE = Math.max(300, Math.min(maxW, maxH));
    PAD = SIZE * 0.055;
    CELL = (SIZE - PAD * 2) / (N - 1);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = SIZE * dpr; cv.height = SIZE * dpr;
    cv.style.width = SIZE + 'px'; cv.style.height = SIZE + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', fit);

  const px = (g) => PAD + g * CELL;
  const gx = (x) => Math.round((x - PAD) / CELL);

  // ---------- 绘制 ----------
  const TAU = Math.PI * 2;
  const BOARD_R = 16;

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // 棋盘底：斜向渐变
    const bg = ctx.createLinearGradient(0, 0, SIZE, SIZE);
    bg.addColorStop(0, C.boardHi);
    bg.addColorStop(0.52, C.board);
    bg.addColorStop(1, C.boardLo);
    ctx.fillStyle = bg;
    roundRect(0, 0, SIZE, SIZE, BOARD_R); ctx.fill();

    // 柔光 / 暗角 + 极淡木纹
    ctx.save();
    roundRect(0, 0, SIZE, SIZE, BOARD_R); ctx.clip();
    const vg = ctx.createRadialGradient(SIZE * 0.3, SIZE * 0.26, SIZE * 0.05, SIZE * 0.52, SIZE * 0.5, SIZE * 0.86);
    vg.addColorStop(0, 'rgba(255,255,255,.16)');
    vg.addColorStop(0.5, 'rgba(255,255,255,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.15)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, SIZE, SIZE);

    ctx.strokeStyle = C.grid; ctx.globalAlpha = 0.07; ctx.lineWidth = 1;
    for (let yy = 7; yy < SIZE; yy += 10) {
      ctx.beginPath();
      ctx.moveTo(-4, yy);
      ctx.bezierCurveTo(SIZE * 0.32, yy + 5, SIZE * 0.68, yy - 5, SIZE + 4, yy + 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 板边内阴影：让棋盘有一点厚度
    ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 1.4;
    roundRect(0.7, 0.7, SIZE - 1.4, SIZE - 1.4, BOARD_R - 0.7); ctx.stroke();
    ctx.restore();

    // 网格
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1.35; ctx.globalAlpha = 0.92;
    for (let i = 0; i < N; i++) {
      line(px(0), px(i), px(N - 1), px(i));
      line(px(i), px(0), px(i), px(N - 1));
    }
    ctx.globalAlpha = 1;
    // 外框：深一档 + 内侧高光
    ctx.strokeStyle = C.grid; ctx.lineWidth = 2.6; ctx.globalAlpha = 1;
    ctx.strokeRect(px(0), px(0), (N - 1) * CELL, (N - 1) * CELL);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 1.2;
    ctx.strokeRect(px(0) + 2.6, px(0) + 2.6, (N - 1) * CELL - 5.2, (N - 1) * CELL - 5.2);

    // 星位
    for (const [sx, sy] of [[3,3],[11,3],[7,7],[3,11],[11,11]]) {
      const cx = px(sx), cy = px(sy);
      ctx.fillStyle = C.grid;
      ctx.beginPath(); ctx.arc(cx, cy, 3.1, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.arc(cx - 0.6, cy - 0.7, 1.1, 0, TAU); ctx.fill();
    }

    // 悬停预览
    if (hover && state === 'human' && board[hover.y * N + hover.x] === EMPTY) {
      ctx.globalAlpha = 0.32;
      drawStone(hover.x, hover.y, ME);
      ctx.globalAlpha = 1;
    }

    // 胜利光晕（在棋子下方，像一条被棋子压住的光带）
    if (winLine) {
      const a = winLine[0], b = winLine[winLine.length - 1];
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = C.danger;
      ctx.globalAlpha = 0.16; ctx.lineWidth = CELL * 0.95;
      ctx.beginPath(); ctx.moveTo(px(a.x), px(a.y)); ctx.lineTo(px(b.x), px(b.y)); ctx.stroke();
      ctx.globalAlpha = 0.3; ctx.lineWidth = CELL * 0.42;
      ctx.beginPath(); ctx.moveTo(px(a.x), px(a.y)); ctx.lineTo(px(b.x), px(b.y)); ctx.stroke();
      ctx.restore();
    }

    // 棋子
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const v = board[y * N + x];
      if (v) drawStone(x, y, v);
    }

    // 最后一手标记
    if (lastMove && !winLine) {
      const lx = px(lastMove.x), ly = px(lastMove.y), d = Math.max(2.6, CELL * 0.085);
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(lx, ly, d + 2, 0, TAU); ctx.fill();
      ctx.save();
      ctx.shadowColor = C.danger; ctx.shadowBlur = 8;
      ctx.fillStyle = C.danger;
      ctx.beginPath(); ctx.arc(lx, ly, d, 0, TAU); ctx.fill();
      ctx.restore();
    }

    // 胜利标记：五颗子各描一圈光边
    if (winLine) {
      ctx.save();
      ctx.strokeStyle = C.danger;
      ctx.lineWidth = 2;
      ctx.shadowColor = C.danger; ctx.shadowBlur = 9;
      ctx.globalAlpha = 0.9;
      for (const c of winLine) {
        ctx.beginPath(); ctx.arc(px(c.x), px(c.y), CELL * 0.455 + 2.2, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawStone(x, y, p) {
    const cx = px(x), cy = px(y), r = CELL * 0.455;
    const hi = p === BLACK ? C.bh : C.wh;
    const lo = p === BLACK ? C.bl : C.wl;

    // 投影（贴着棋盘的接触阴影）
    ctx.save();
    ctx.shadowColor = p === BLACK ? 'rgba(3,6,12,.55)' : 'rgba(12,18,32,.35)';
    ctx.shadowBlur = r * 0.7;
    ctx.shadowOffsetY = r * 0.3;
    ctx.fillStyle = lo;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.restore();

    // 石体：左上高光 → 右下暗部
    const g = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.46, r * 0.05, cx + r * 0.16, cy + r * 0.22, r * 1.08);
    g.addColorStop(0, hi);
    g.addColorStop(0.5, p === BLACK ? C.bm : C.wm);
    g.addColorStop(1, lo);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();

    // 高光：一大一小
    ctx.fillStyle = p === BLACK ? 'rgba(190,205,235,.34)' : 'rgba(255,255,255,1)';
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.34, cy - r * 0.42, r * 0.24, r * 0.15, -0.62, 0, TAU);
    ctx.fill();
    ctx.fillStyle = p === BLACK ? 'rgba(235,242,255,.45)' : 'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.46, cy - r * 0.2, r * 0.075, 0, TAU);
    ctx.fill();

    // 边缘反光：整圈微光 + 下半弧更亮
    ctx.strokeStyle = p === BLACK ? 'rgba(150,172,214,.20)' : 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, r - 1, 0, TAU); ctx.stroke();
    ctx.strokeStyle = p === BLACK ? 'rgba(186,205,240,.42)' : 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, cy, r - 1, 0.14 * Math.PI, 0.86 * Math.PI); ctx.stroke();

    // 外沿描边
    ctx.strokeStyle = p === BLACK ? 'rgba(0,0,0,.62)' : 'rgba(88,102,126,.42)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  // ---------- 音效 ----------
  let AC = null;
  function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
  function beep(freq, dur, type, vol) {
    if (!AC || mute) return;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }
  const sndPlace = () => { beep(660, 0.08, 'triangle', 0.18); setTimeout(() => beep(440, 0.06, 'triangle', 0.1), 30); };
  const sndWin = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'sine', 0.16), i * 110)); };
  const sndLose = () => { [330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'sine', 0.16), i * 150)); };

  // ---------- 背景音乐（WebAudio 合成，无外部音频文件） ----------
  let musicOn = localStorage.getItem('gomoku-music') !== '0';
  let musicBus = null, musicTimer = null, barIdx = 0;
  const BAR = 6.4;

  // 和弦走向：Am7 - Fmaj7 - Cmaj7 - G6，速度很慢、音量很轻
  const PROG = [
    { bass: 110.00, notes: [261.63, 329.63, 392.00] },
    { bass:  87.31, notes: [220.00, 261.63, 329.63] },
    { bass: 130.81, notes: [329.63, 392.00, 493.88] },
    { bass:  98.00, notes: [246.94, 293.66, 392.00] },
  ];
  const PENTA = [440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

  function buildMusicBus() {
    if (!AC || musicBus) return;
    const master = AC.createGain();
    master.gain.value = 0.0001;
    master.connect(AC.destination);

    const pad = AC.createGain();
    pad.gain.value = 1;
    const lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2300; lp.Q.value = 0.4;
    pad.connect(lp); lp.connect(master);

    const mel = AC.createGain();
    mel.gain.value = 1;
    mel.connect(master);                       // 干声
    const dly = AC.createDelay(1.5);
    dly.delayTime.value = 0.46;
    const fb = AC.createGain(); fb.gain.value = 0.3;
    const wet = AC.createGain(); wet.gain.value = 0.42;
    mel.connect(dly); dly.connect(fb); fb.connect(dly);
    dly.connect(wet); wet.connect(master);     // 湿声（回声）

    musicBus = { master, pad, mel };
  }

  function musicTone(freq, at, dur, type, vol, dest, attack, release) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.detune.value = (Math.random() - 0.5) * 7;
    const a = attack || 1.2, r = release || 2.2;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + a);
    g.gain.setValueAtTime(vol, at + Math.max(a, dur - r));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(dest);
    o.start(at); o.stop(at + dur + 0.08);
  }

  function scheduleBar() {
    if (!AC || !musicBus || !musicOn) return;
    const t = AC.currentTime + 0.12;
    const p = PROG[barIdx % PROG.length];
    barIdx++;
    musicTone(p.bass, t, BAR, 'sine', 0.05, musicBus.pad, 1.8, 2.8);
    for (let i = 0; i < p.notes.length; i++) {
      musicTone(p.notes[i], t + i * 0.09, BAR, 'triangle', 0.027, musicBus.pad, 2.0, 2.9);
    }
    musicTone(p.notes[0] * 2, t + 0.5, BAR * 0.72, 'sine', 0.014, musicBus.pad, 2.4, 2.2);
    // 稀疏旋律
    const cnt = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < cnt; i++) {
      const nt = PENTA[Math.floor(Math.random() * PENTA.length)];
      const off = 0.7 + Math.random() * (BAR - 2.6);
      musicTone(nt, t + off, 2.8, 'sine', 0.036, musicBus.mel, 0.04, 2.4);
    }
  }

  function startMusic() {
    if (!musicOn) return;
    initAudio();
    if (!AC) return;
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    buildMusicBus();
    if (musicTimer) return;
    const t = AC.currentTime;
    musicBus.master.gain.cancelScheduledValues(t);
    musicBus.master.gain.setValueAtTime(Math.max(0.0001, musicBus.master.gain.value), t);
    musicBus.master.gain.linearRampToValueAtTime(0.6, t + 4);
    barIdx = 0;
    scheduleBar();
    musicTimer = setInterval(scheduleBar, BAR * 1000);
  }

  function stopMusic(fade) {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (AC && musicBus) {
      const t = AC.currentTime;
      musicBus.master.gain.cancelScheduledValues(t);
      musicBus.master.gain.setValueAtTime(Math.max(0.0001, musicBus.master.gain.value), t);
      musicBus.master.gain.linearRampToValueAtTime(0.0001, t + (fade || 1.2));
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopMusic(0.4);
    else if (musicOn && state !== 'idle') startMusic();
  });

  // ---------- 规则 ----------
  const DIRS = [[1,0],[0,1],[1,1],[1,-1]];
  function lineAt(x, y, p) {
    for (const [dx, dy] of DIRS) {
      const cells = [{x, y}];
      for (const s of [1, -1]) {
        let nx = x + dx * s, ny = y + dy * s;
        while (nx >= 0 && nx < N && ny >= 0 && ny < N && board[ny * N + nx] === p) {
          cells.push({x: nx, y: ny});
          nx += dx * s; ny += dy * s;
        }
      }
      if (cells.length >= 5) return cells.sort((a, b) => (a.x - b.x) || (a.y - b.y)).slice(0, 6);
    }
    return null;
  }
  function bumpNear(x, y, d) {
    const y0 = Math.max(0, y - 2), y1 = Math.min(N - 1, y + 2);
    const x0 = Math.max(0, x - 2), x1 = Math.min(N - 1, x + 2);
    for (let ny = y0; ny <= y1; ny++) {
      const row = ny * N;
      for (let nx = x0; nx <= x1; nx++) nearCnt[row + nx] += d;
    }
  }
  function place(x, y, p) {
    board[y * N + x] = p;
    bumpNear(x, y, 1);
    history.push({x, y, p});
    lastMove = {x, y};
  }
  function unplace() {
    const m = history.pop();
    if (m) { board[m.y * N + m.x] = EMPTY; bumpNear(m.x, m.y, -1); }
    const prev = history[history.length - 1];
    lastMove = prev ? {x: prev.x, y: prev.y} : null;
    return m;
  }

  // ---------- AI ----------
  // 静态评估用的五连窗口
  const WINDOWS = (() => {
    const ws = [];
    for (let y = 0; y < N; y++) for (let x = 0; x <= N - 5; x++) ws.push([0,1,2,3,4].map(i => y*N + x + i));
    for (let x = 0; x < N; x++) for (let y = 0; y <= N - 5; y++) ws.push([0,1,2,3,4].map(i => (y+i)*N + x));
    for (let y = 0; y <= N - 5; y++) for (let x = 0; x <= N - 5; x++) ws.push([0,1,2,3,4].map(i => (y+i)*N + x + i));
    for (let y = 4; y < N; y++) for (let x = 0; x <= N - 5; x++) ws.push([0,1,2,3,4].map(i => (y-i)*N + x + i));
    return ws;
  })();
  const WS = [0, 2, 26, 620, 9000, 1000000];
  const WIN_SCORE = 1e9;
  // 棋型价值
  const T = { FIVE: 1e9, OPEN4: 5e7, DBL: 2e7, FOUR: 3e6, OPEN3: 5e5, THREE: 6e4 };
  const LINE = new Uint8Array(9);

  // 假设在 (x,y) 落 p 之后，四个方向形成的最高威胁价值（已含双四/四三/双三判断）
  function threatVal(x, y, p) {
    let five = 0, open4 = 0, four = 0, open3 = 0, three = 0;
    for (let d = 0; d < 4; d++) {
      const dx = DIRS[d][0], dy = DIRS[d][1];
      for (let i = -4; i <= 4; i++) {
        if (i === 0) { LINE[4] = 1; continue; }
        const nx = x + dx * i, ny = y + dy * i;
        if (nx < 0 || nx >= N || ny < 0 || ny >= N) { LINE[i + 4] = 2; continue; }
        const v = board[ny * N + nx];
        LINE[i + 4] = v === EMPTY ? 0 : (v === p ? 1 : 2);
      }
      let c5 = 0, c4 = 0, c3 = 0;
      for (let s = 0; s <= 4; s++) {           // 含落点的 5 格窗口
        let me = 0, bad = false;
        for (let k = 0; k < 5; k++) {
          const v = LINE[s + k];
          if (v === 2) { bad = true; break; }
          if (v === 1) me++;
        }
        if (bad) continue;
        if (me === 5) c5++;
        else if (me === 4) c4++;
        else if (me === 3) c3++;
      }
      if (c5) five++;
      else if (c4 >= 2) open4++;               // 011110：两端成五点 → 活四
      else if (c4 === 1) four++;               // 冲四
      else if (c3 >= 2) open3++;               // 活三（含跳活三）
      else if (c3 === 1) three++;              // 眠三
    }
    if (five) return T.FIVE;
    if (open4) return T.OPEN4;
    const fours = four + open4;
    if (fours >= 2) return T.DBL;              // 双四
    if (four >= 1 && open3 >= 1) return T.DBL; // 四三
    if (open3 >= 2) return T.DBL * 0.6;        // 双活三
    if (fours === 1) return T.FOUR;
    if (open3 === 1) return T.OPEN3;
    if (three >= 1) return T.THREE;
    return 0;
  }

  // 候选点：只在已有棋子周围 2 格内搜索，按「我方威胁 + 对方威胁」排序
  function genMoves(p, limit) {
    const opp = p === BLACK ? WHITE : BLACK;
    const list = [];
    for (let y = 0; y < N; y++) {
      const row = y * N;
      for (let x = 0; x < N; x++) {
        if (board[row + x] !== EMPTY || nearCnt[row + x] === 0) continue;
        const atk = threatVal(x, y, p);
        const def = threatVal(x, y, opp);
        let s = atk > def * 0.92 ? atk : def * 0.92;
        if (atk >= T.FIVE) s += 1e8;           // 能成五
        else if (def >= T.FIVE) s += 5e7;      // 必须挡五
        list.push({ x, y, s, atk, def });
      }
    }
    if (list.length === 0 && history.length === 0) list.push({ x: 7, y: 7, s: 1, atk: 0, def: 0 });
    list.sort((a, b) => b.s - a.s);
    return limit ? list.slice(0, limit) : list;
  }

  // 静态评估（AI=白为正）；p 为当前行棋方——有「四」的一方下一手必成五
  function evalBoard(p) {
    let sw = 0, sb = 0, w4 = 0, b4 = 0;
    for (let wi = 0; wi < WINDOWS.length; wi++) {
      const w = WINDOWS[wi];
      let b = 0, wh = 0;
      for (let k = 0; k < 5; k++) {
        const v = board[w[k]];
        if (v === BLACK) b++; else if (v === WHITE) wh++;
      }
      if (b && wh) continue;
      if (wh) { sw += WS[wh]; if (wh === 4) w4++; }
      else if (b) { sb += WS[b]; if (b === 4) b4++; }
    }
    if (w4 || b4) {
      // 行棋方有「冲四」→ 下一手直接成五；只有对方有四 → 必须去挡，凶多吉少
      if (p === WHITE) {
        if (w4) return WIN_SCORE * 0.75;
        return -WIN_SCORE * 0.35;
      }
      if (b4) return -WIN_SCORE * 0.75;
      return WIN_SCORE * 0.35;
    }
    return sw - sb * 1.08;
  }

  // 负极大值搜索：返回 p 视角分数；超时返回 null
  let nodes = 0, aiInfo = { nodes: 0, ms: 0 };
  function search(depth, alpha, beta, p, deadline) {
    nodes++;
    if (depth <= 0) return { s: p === AI ? evalBoard(p) : -evalBoard(p), move: null };
    if (performance.now() > deadline) return null;
    const opp = p === BLACK ? WHITE : BLACK;
    const moves = genMoves(p, depth >= 4 ? 10 : 8);
    if (moves.length === 0) return { s: 0, move: null };
    let bestS = -Infinity, bestM = null;
    for (let mi = 0; mi < moves.length; mi++) {
      const m = moves[mi], idx = m.y * N + m.x;
      board[idx] = p; bumpNear(m.x, m.y, 1);
      let sc;
      if (lineAt(m.x, m.y, p)) {
        sc = WIN_SCORE - (12 - depth);
      } else {
        const r = search(depth - 1, -beta, -alpha, opp, deadline);
        if (r === null) { board[idx] = EMPTY; bumpNear(m.x, m.y, -1); return null; }
        sc = -r.s;
      }
      board[idx] = EMPTY; bumpNear(m.x, m.y, -1);
      if (sc > bestS) { bestS = sc; bestM = m; }
      if (sc > alpha) alpha = sc;
      if (alpha >= beta) break;
    }
    return { s: bestS, move: bestM };
  }

  // 所有能让 p 一步成五的点
  function fivePoints(p, cap) {
    const res = [];
    for (let y = 0; y < N; y++) {
      const row = y * N;
      for (let x = 0; x < N; x++) {
        if (board[row + x] !== EMPTY || nearCnt[row + x] === 0) continue;
        board[row + x] = p;
        const w = lineAt(x, y, p);
        board[row + x] = EMPTY;
        if (w) {
          res.push({ x, y });
          if (res.length >= (cap || 8)) return res;
        }
      }
    }
    return res;
  }

  // 冲四（VCF）搜索：只用连续「四」逼对手，找强制胜
  function vcf(p, depth, deadline) {
    if (performance.now() > deadline) return null;
    const opp = p === BLACK ? WHITE : BLACK;
    const mine = fivePoints(p, 1);
    if (mine.length) return mine[0];                 // 直接成五
    if (depth <= 0) return null;
    if (fivePoints(opp, 1).length) return null;      // 对方有四，冲四杀不成立
    const cands = genMoves(p, 12);
    for (let ci = 0; ci < cands.length; ci++) {
      const m = cands[ci], idx = m.y * N + m.x;
      board[idx] = p; bumpNear(m.x, m.y, 1);
      const fp = fivePoints(p, 3);
      if (fp.length >= 2) {                          // 双四，对手只能挡一个
        board[idx] = EMPTY; bumpNear(m.x, m.y, -1);
        return { x: m.x, y: m.y };
      }
      if (fp.length === 1) {
        const b = fp[0], bidx = b.y * N + b.x;
        board[bidx] = opp; bumpNear(b.x, b.y, 1);
        const sub = (lineAt(b.x, b.y, opp) === null) ? vcf(p, depth - 1, deadline) : null;
        board[bidx] = EMPTY; bumpNear(b.x, b.y, -1);
        board[idx] = EMPTY; bumpNear(m.x, m.y, -1);
        if (performance.now() > deadline) return null;
        if (sub) return { x: m.x, y: m.y };
      } else {
        board[idx] = EMPTY; bumpNear(m.x, m.y, -1);
      }
    }
    return null;
  }

  function aiThink() {
    // 1. 能赢直接赢
    const w1 = fivePoints(AI, 1);
    if (w1.length) return w1[0];
    // 2. 对手下一手能赢必须堵
    const b1 = fivePoints(ME, 1);
    if (b1.length) return b1[0];

    if (diff === 'easy') {
      const list = genMoves(AI, 6);
      if (!list.length) return { x: 7, y: 7 };
      const k = Math.min(list.length, 3);
      const idx = Math.random() < 0.65 ? 0 : 1 + Math.floor(Math.random() * (k - 1));
      return list[idx];
    }

    const t0 = performance.now();
    const hard = diff === 'hard' || diff === 'master';
    const early = history.length < 10;               // 开局阶段缩短思考时间
    // 高难度：先算连续冲四杀
    if (hard) {
      const vb = (diff === 'master' ? 1400 : 900) * (early ? 0.5 : 1);
      const v = vcf(AI, diff === 'master' ? 10 : 8, t0 + vb);
      if (v) { aiInfo = { path: 'vcf', nodes, ms: Math.round(performance.now() - t0) }; return v; }
    }
    const base = diff === 'master' ? 2600 : hard ? 1800 : 700;
    const deadline = t0 + Math.round(base * (early ? 0.55 : 1));
    let maxDepth = diff === 'master' ? 8 : hard ? 6 : 4;
    if (early) maxDepth = Math.min(maxDepth, 6);
    let best = null;
    nodes = 0;
    // 迭代加深，超时用上一层结果
    for (let d = 2; d <= maxDepth; d += 2) {
      const r = search(d, -Infinity, Infinity, AI, deadline);
      if (!r) break;
      if (r.move) best = r.move;
      if (Math.abs(r.s) > WIN_SCORE / 2) break;      // 已算出必胜/必败
      if (performance.now() > deadline) break;
    }
    aiInfo = { nodes, ms: Math.round(performance.now() - t0) };
    if (!best) {
      const list = genMoves(AI, 1);
      best = list[0] || { x: 7, y: 7 };
    }
    return best;
  }

  // ---------- 流程 ----------
  function setHud() {
    if (state === 'human') { statusEl.textContent = '轮到你落子（执黑）'; statusEl.classList.remove('turn-ai'); }
    else if (state === 'thinking') { statusEl.textContent = 'AI 思考中…'; statusEl.classList.add('turn-ai'); }
    else if (state === 'over') { statusEl.textContent = '对局结束'; statusEl.classList.remove('turn-ai'); }
    else { statusEl.textContent = '执黑先行'; statusEl.classList.remove('turn-ai'); }
    undoBtn.disabled = !(state === 'human' && history.length >= 2);
  }
  function renderRecord() {
    recRow.textContent = `战绩 · 胜 ${record.w} / 负 ${record.l} / 平 ${record.d}`;
  }
  function saveRecord() { localStorage.setItem('gomoku-record', JSON.stringify(record)); }

  function humanMove(x, y) {
    if (state !== 'human' || board[y*N+x] !== EMPTY) return;
    initAudio();
    place(x, y, ME);
    sndPlace();
    const w = lineAt(x, y, ME);
    if (w) { endGame('win', w); return; }
    if (history.length === N * N) { endGame('draw'); return; }
    state = 'thinking'; setHud(); draw();
    // 让 UI 先渲染，再思考
    setTimeout(() => {
      const t0 = performance.now();
      const mv = aiThink();
      const wait = Math.max(0, 350 - (performance.now() - t0));   // 至少停顿 350ms，别瞬回
      setTimeout(() => {
        place(mv.x, mv.y, AI);
        sndPlace();
        const w2 = lineAt(mv.x, mv.y, AI);
        if (w2) { endGame('lose', w2); return; }
        if (history.length === N * N) { endGame('draw'); return; }
        state = 'human'; setHud(); draw();
      }, wait);
    }, 60);
  }

  function endGame(result, line) {
    state = 'over';
    winLine = line || null;
    if (result === 'win') { record.w++; sndWin(); ovBadge.textContent = '🎉'; ovTitle.textContent = '你赢了！'; ovTitle.classList.remove('lose'); ovText.textContent = '干净利落，AI 甘拜下风。'; }
    else if (result === 'lose') { record.l++; sndLose(); ovBadge.textContent = '😵'; ovTitle.textContent = 'AI 获胜'; ovTitle.classList.add('lose'); ovText.textContent = '差一口气，再来一局翻盘？'; }
    else { record.d++; ovBadge.textContent = '🤝'; ovTitle.textContent = '平局'; ovTitle.classList.remove('lose'); ovText.textContent = '棋盘下满了，势均力敌。'; }
    saveRecord(); renderRecord();
    ovStats.innerHTML = `<span>共 ${history.length} 手</span><span>胜 ${record.w} · 负 ${record.l} · 平 ${record.d}</span>`;
    setTimeout(() => { cardStart.style.display = 'none'; cardOver.style.display = ''; overlay.classList.remove('hidden'); }, line ? 1700 : 300);
    setHud(); draw();
  }

  function startGame() {
    board = new Uint8Array(N * N);
    nearCnt = new Uint16Array(N * N);
    history = []; winLine = null; lastMove = null; hover = null;
    state = 'human';
    overlay.classList.add('hidden');
    setHud(); draw();
  }
  function showStart() {
    cardOver.style.display = 'none'; cardStart.style.display = '';
    overlay.classList.remove('hidden');
    state = 'idle'; setHud(); draw();
  }

  // ---------- 输入（唯一指针入口） ----------
  cv.addEventListener('pointermove', (e) => {
    const r = cv.getBoundingClientRect();
    const g = gx(e.clientX - r.left), gy = gx(e.clientY - r.top);
    const ok = g >= 0 && g < N && gy >= 0 && gy < N;
    const changed = (hover && (hover.x !== g || hover.y !== gy)) || (!hover && ok);
    hover = ok ? {x: g, y: gy} : null;
    if (changed && state === 'human') draw();
  });
  cv.addEventListener('pointerleave', () => { hover = null; if (state === 'human') draw(); });
  cv.addEventListener('click', (e) => {
    if (state !== 'human') return;
    const r = cv.getBoundingClientRect();
    const g = gx(e.clientX - r.left), gy = gx(e.clientY - r.top);
    if (g >= 0 && g < N && gy >= 0 && gy < N) humanMove(g, gy);
  });
  document.querySelectorAll('#card-start [data-diff]').forEach((b) => {
    b.addEventListener('click', () => { diff = b.dataset.diff; initAudio(); startGame(); startMusic(); });
  });
  againBtn.addEventListener('click', () => { startGame(); startMusic(); });
  rediffBtn.addEventListener('click', showStart);
  undoBtn.addEventListener('click', () => {
    if (state !== 'human' || history.length < 2) return;
    unplace(); unplace();   // 撤回 AI + 自己
    setHud(); draw();
  });
  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    localStorage.setItem('gomoku-music', musicOn ? '1' : '0');
    musicBtn.textContent = musicOn ? '🎵' : '🔕';
    if (musicOn) startMusic(); else stopMusic(0.6);
  });
  muteBtn.addEventListener('click', () => {
    mute = !mute;
    muteBtn.textContent = mute ? '🔇' : '🔊';
    localStorage.setItem('gomoku-mute', mute ? '1' : '0');
    initAudio();
  });

  // 测试钩子
  window.__gomokuTest = {
    state: () => ({ state, diff, moves: history.length, last: lastMove, record: { ...record } }),
    board: () => Array.from(board),
    play: (x, y) => humanMove(x, y),
    setCell: (x, y, p) => {
      const i = y * N + x;
      if (board[i] === EMPTY && p !== EMPTY) bumpNear(x, y, 1);
      else if (board[i] !== EMPTY && p === EMPTY) bumpNear(x, y, -1);
      board[i] = p;
    },
    clear: () => { board = new Uint8Array(N * N); nearCnt = new Uint16Array(N * N); },
    bestFor: (p, maxDepth, budget) => {
      const t0 = performance.now();
      const dl = t0 + (budget || 1200);
      let best = null, reached = 0;
      for (let d = 2; d <= maxDepth; d += 2) {
        const r = search(d, -Infinity, Infinity, p, dl);
        if (!r) break;
        if (r.move) { best = r.move; reached = d; }
        if (Math.abs(r.s) > WIN_SCORE / 2) break;
      }
      if (!best) { const l = genMoves(p, 1); best = l[0] || { x: 7, y: 7 }; }
      return { x: best.x, y: best.y, ms: Math.round(performance.now() - t0), depth: reached };
    },
    think: (d) => {
      diff = d || diff;
      const t0 = performance.now();
      const mv = aiThink();
      return { x: mv.x, y: mv.y, ms: Math.round(performance.now() - t0), info: { ...aiInfo } };
    },
    threat: (x, y, p) => threatVal(x, y, p),
    eval: (p) => evalBoard(p || AI),
    redraw: () => draw(),
    music: () => ({ on: musicOn, running: !!musicTimer, gain: musicBus ? +musicBus.master.gain.value.toFixed(3) : 0, state: AC ? AC.state : null }),
  };

  // ---------- 启动 ----------
  muteBtn.textContent = mute ? '🔇' : '🔊';
  musicBtn.textContent = musicOn ? '🎵' : '🔕';
  renderRecord();
  fit();
  showStart();
})();
</script>
</body>
</html>
