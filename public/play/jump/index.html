<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>霓虹跳跃</title>
<style>
  :root {
    --bg: #f7f8fc; --surface: #ffffff; --border: #e6e9f0;
    --text: #1c2233; --muted: #8892a4;
    --accent: #5b5bd6; --accent2: #0ea5b7; --danger: #f43f5e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0e111a; --surface: #171c28; --border: #2a3141;
      --text: #e8ebf3; --muted: #8b95a8;
      --accent: #9b9bff; --accent2: #4dd0d8; --danger: #fb7185;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0e111a; --surface: #171c28; --border: #2a3141;
    --text: #e8ebf3; --muted: #8b95a8;
    --accent: #9b9bff; --accent2: #4dd0d8; --danger: #fb7185;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 12px;
  }
  .hud {
    display: flex; gap: 22px; font-size: 15px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border);
    padding: 7px 20px; border-radius: 12px;
  }
  .hud span { color: var(--muted); font-weight: 500; margin-right: 6px; }
  .stage { position: relative; }
  canvas {
    display: block; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 40px rgba(31, 41, 79, 0.10);
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: blur(6px); border-radius: 14px;
    text-align: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 25px; letter-spacing: -.02em; }
  .overlay p { color: var(--muted); font-size: 14px; line-height: 1.8; }
  .btn {
    border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px;
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 10px 28px; border-radius: 12px;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .btn:active { transform: scale(.97); }
  .tip { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="hud">
    <div><span>得分</span><b id="score">0</b></div>
    <div><span>最高分</span><b id="best">0</b></div>
    <div><span>速度</span><b id="spd">1.0x</b></div>
  </div>
  <div class="stage">
    <canvas id="cv" width="880" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">🏃 霓虹跳跃</h2>
      <p id="ov-text">空格 / ↑ / 点击屏幕跳跃<br>长按跳得更高，躲开地刺和飞鸟</p>
      <button class="btn" id="start-btn">开始游戏</button>
    </div>
  </div>
  <div class="tip">空格 / ↑ / 触屏点击跳跃 · 长按跳更高 · 空中再点一次可二段跳</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const spdEl = document.getElementById('spd');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const startBtn = document.getElementById('start-btn');
  const BEST_KEY = 'jump-best';

  const W = cv.width, H = cv.height;
  const GROUND_Y = H - 52;          // 地面线
  const GRAVITY = 2200;             // px/s²
  const JUMP_V = -780;              // 起跳初速度
  const HOLD_G = 1150;              // 长按期间的重力（跳更高）

  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  // 自适应画布
  function fit() {
    const maxW = Math.min(window.innerWidth - 24, 880);
    const maxH = window.innerHeight - 130;
    const scale = Math.min(maxW / W, maxH / (H * 0.75), 1);
    cv.style.width = (W * scale) + 'px';
    cv.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  let C = {};
  function refreshColors() {
    C = { text: css('--text'), muted: css('--muted'), border: css('--border'),
          accent: css('--accent'), accent2: css('--accent2'), danger: css('--danger'),
          surface: css('--surface') };
  }
  refreshColors();

  // ---------- 游戏状态 ----------
  let state = 'idle';  // idle | running | over
  let score = 0, scoreF = 0, speed = 380, lastT = 0;
  let player, obstacles, particles, clouds, stars, spawnTimer, birdTimer, jumpHeld, canDouble;

  function reset() {
    player = { x: 90, y: GROUND_Y, w: 34, h: 44, vy: 0, onGround: true, squash: 1 };
    obstacles = []; particles = []; clouds = []; stars = [];
    score = 0; scoreF = 0; speed = 380; spawnTimer = 1.2; birdTimer = 6;
    jumpHeld = false; canDouble = false;
    scoreEl.textContent = '0'; spdEl.textContent = '1.0x';
    for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 120, s: 0.5 + Math.random() * 0.8 });
    for (let i = 0; i < 40; i++) stars.push({ x: Math.random() * W, y: Math.random() * (GROUND_Y - 60), r: Math.random() * 1.6 + 0.4, tw: Math.random() * Math.PI * 2 });
  }

  function spawnObstacle() {
    const roll = Math.random();
    if (roll < 0.22 && score > 300) {
      // 飞鸟（三档高度：低=必须跳不行需早跳/高=不跳/中=蹲不了只能算时机）
      const heights = [GROUND_Y - 64, GROUND_Y - 96, GROUND_Y - 130];
      const y = heights[Math.floor(Math.random() * heights.length)];
      obstacles.push({ type: 'bird', x: W + 40, y, w: 42, h: 26, flap: 0 });
    } else if (roll < 0.55) {
      // 双刺：两个独立障碍，各自有碰撞盒
      obstacles.push({ type: 'cactus', x: W + 40, y: GROUND_Y, w: 24, h: 34, n: 1 });
      obstacles.push({ type: 'cactus', x: W + 63, y: GROUND_Y, w: 24, h: 34, n: 1 });
    } else {
      // 单刺（高矮两种）
      const h = Math.random() < 0.5 ? 30 : 44;
      obstacles.push({ type: 'cactus', x: W + 40, y: GROUND_Y, w: 24, h, n: 1 });
    }
    spawnTimer = 0.9 + Math.random() * (speed > 700 ? 0.6 : 1.4);
  }

  function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
      particles.push({ x, y, vx: (Math.random() - 0.5) * 420, vy: (Math.random() - 0.8) * 380,
        life: 0.5 + Math.random() * 0.3, color });
    }
  }

  function doJump() {
    if (state !== 'running') return;
    if (player.onGround) {
      player.vy = JUMP_V; player.onGround = false; player.squash = 1.35;
      canDouble = true;
    } else if (canDouble) {
      player.vy = JUMP_V * 0.82; canDouble = false; player.squash = 1.3;
      burst(player.x + player.w / 2, player.y, C.accent2);
    }
  }

  function gameOver() {
    state = 'over';
    burst(player.x + player.w / 2, player.y - player.h / 2, C.danger);
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem(BEST_KEY, best); }
    ovTitle.textContent = '💀 游戏结束';
    ovText.innerHTML = `本局得分 <b>${score}</b> · 最高分 <b>${best}</b><br>距离退休又近了一步？`;
    startBtn.textContent = '再来一局';
    setTimeout(() => overlay.classList.remove('hidden'), 350);
  }

  function start() {
    reset(); state = 'running';
    overlay.classList.add('hidden');
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  function pause() {
    if (state !== 'running') return;
    state = 'idle';
    ovTitle.textContent = '⏸ 已暂停';
    ovText.textContent = '点击继续按钮回到游戏';
    startBtn.textContent = '继续';
    overlay.classList.remove('hidden');
  }

  // ---------- 更新 ----------
  function update(dt) {
    // 背景
    clouds.forEach(c => { c.x -= (speed * 0.18 * c.s) * dt; if (c.x < -80) { c.x = W + 60; c.y = 40 + Math.random() * 120; } });
    stars.forEach(s => { s.tw += dt * 2; });

    // 难度曲线
    scoreF += speed * dt * 0.08;
    score = Math.floor(scoreF);
    scoreEl.textContent = score;
    const mult = (speed / 380).toFixed(1);
    spdEl.textContent = mult + 'x';
    speed = Math.min(980, speed + dt * 9);

    // 玩家
    const g = (jumpHeld && player.vy < 0) ? HOLD_G : GRAVITY;
    player.vy += g * dt;
    player.y += player.vy * dt;
    if (player.y >= GROUND_Y) {
      if (!player.onGround) player.squash = 0.78;
      player.y = GROUND_Y; player.vy = 0; player.onGround = true;
    }
    player.squash += (1 - player.squash) * Math.min(dt * 12, 1);

    // 障碍
    spawnTimer -= dt;
    if (spawnTimer <= 0) spawnObstacle();
    birdTimer -= dt;

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed * dt;
      if (o.type === 'bird') { o.flap += dt * 14; o.x -= 60 * dt; }
      if (o.x + o.w < -20) { obstacles.splice(i, 1); continue; }
      // AABB 碰撞（玩家碰撞盒略缩小，宽容一点）
      const px = player.x + 5, py = player.y - player.h + 4, pw = player.w - 10, ph = player.h - 8;
      const ox = o.x + (o.type === 'cactus' ? 4 : 5), oy = o.type === 'cactus' ? o.y - o.h : o.y + 3;
      const ow = o.w - 8, oh = o.type === 'cactus' ? o.h : o.h - 6;
      if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) { gameOver(); return; }
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt; if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }

  // ---------- 绘制 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = C.surface;
    ctx.fillRect(0, 0, W, H);

    // 星星（闪烁）
    stars.forEach(s => {
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(s.tw);
      ctx.fillStyle = C.muted;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 视差云
    clouds.forEach(c => {
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = C.border;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 16 * c.s, Math.PI * 0.6, Math.PI * 1.5);
      ctx.arc(c.x + 22 * c.s, c.y - 6 * c.s, 14 * c.s, Math.PI, Math.PI * 1.9);
      ctx.arc(c.x + 44 * c.s, c.y, 15 * c.s, Math.PI * 1.2, Math.PI * 2.1);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // 地面
    ctx.strokeStyle = C.border;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 1); ctx.lineTo(W, GROUND_Y + 1); ctx.stroke();
    // 地面虚线纹理
    ctx.globalAlpha = 0.5;
    const off = (performance.now() / 16) % 36;
    for (let x = -36 + off; x < W; x += 36) {
      ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 10); ctx.lineTo(x + 16, GROUND_Y + 10); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 障碍
    obstacles.forEach(o => {
      if (o.type === 'cactus') {
        ctx.fillStyle = C.danger;
        ctx.shadowColor = C.danger; ctx.shadowBlur = 10;
        for (let i = 0; i < o.n; i++) {
          const x = o.x + i * (o.w + 3);
          const baseY = o.y;
          const tipY = o.y - o.h;
          const midX = x + o.w / 2;
          // 主体三角
          ctx.beginPath();
          ctx.moveTo(x, baseY);
          ctx.quadraticCurveTo(midX - o.w * 0.16, baseY - o.h * 0.55, midX, tipY);
          ctx.quadraticCurveTo(midX + o.w * 0.16, baseY - o.h * 0.55, x + o.w, baseY);
          ctx.closePath();
          ctx.fill();
          // 高光
          ctx.globalAlpha = 0.35;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(midX, baseY - 3);
          ctx.quadraticCurveTo(midX - o.w * 0.06, baseY - o.h * 0.5, midX, tipY + 4);
          ctx.quadraticCurveTo(midX + o.w * 0.03, baseY - o.h * 0.5, midX + o.w * 0.12, baseY - 3);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = C.danger;
        }
        ctx.shadowBlur = 0;
      } else {
        // 飞鸟
        const flap = Math.sin(o.flap) * 8;
        ctx.fillStyle = C.accent2;
        ctx.shadowColor = C.accent2; ctx.shadowBlur = 10;
        roundRect(o.x + 10, o.y, 22, 16, 7); ctx.fill();
        // 翅膀
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(o.x + 16, o.y + 6);
        ctx.lineTo(o.x - 2, o.y + 6 - flap);
        ctx.lineTo(o.x + 16, o.y + 13);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
        // 眼睛
        ctx.shadowBlur = 0;
        ctx.fillStyle = C.surface;
        ctx.beginPath(); ctx.arc(o.x + 27, o.y + 5, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = C.text;
        ctx.beginPath(); ctx.arc(o.x + 28, o.y + 5, 1.2, 0, Math.PI * 2); ctx.fill();
      }
    });

    // 玩家（果冻方块）
    const sq = player.squash;
    const ph = player.h * sq, pw = player.w / sq;
    const px = player.x, py = player.y - ph;
    ctx.save();
    ctx.shadowColor = C.accent; ctx.shadowBlur = 16;
    ctx.fillStyle = C.accent;
    roundRect(px, py, pw, ph, 9); ctx.fill();
    ctx.restore();
    // 眼睛
    const blink = Math.sin(performance.now() / 900) > 0.96 ? 0.25 : 1;
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = blink;
    ctx.beginPath(); ctx.arc(px + pw * 0.62, py + ph * 0.34, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + pw * 0.85, py + ph * 0.34, 5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.text;
    ctx.beginPath(); ctx.arc(px + pw * 0.64, py + ph * 0.36, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + pw * 0.87, py + ph * 0.36, 2.4, 0, Math.PI * 2); ctx.fill();
    // 二段跳提示圈
    if (!player.onGround && canDouble) {
      ctx.strokeStyle = C.accent2;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px + pw / 2, py - 12, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 粒子
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life * 2, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function loop(t) {
    if (state !== 'running') return;
    const dt = Math.min((t - lastT) / 1000, 0.033);
    lastT = t;
    update(dt);
    if (state === 'running') { draw(); requestAnimationFrame(loop); }
  }

  // 静态首屏
  reset(); draw();

  // ---------- 输入 ----------
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'arrowup' || k === 'w') {
      e.preventDefault();
      if (state === 'running') { jumpHeld = true; doJump(); }
      else if (state === 'over') start();
    }
    if (k === 'p') pause();
  });
  document.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'arrowup' || k === 'w') jumpHeld = false;
  });
  // 点击/触摸任意位置跳跃（canvas 上的事件也会冒泡到这里；暂停覆盖层时不生效）
  document.addEventListener('pointerdown', (e) => {
    if (state !== 'running') return;
    if (e.target instanceof HTMLButtonElement) return;
    jumpHeld = true; doJump();
  });
  window.addEventListener('pointerup', () => { jumpHeld = false; });

  startBtn.addEventListener('click', () => {
    if (state === 'running') { pause(); } else { start(); }
  });

  // 跟随宿主站点主题
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'theme') {
      document.documentElement.dataset.theme = e.data.theme;
      refreshColors();
      if (state !== 'running') draw();
    }
  });
})();
</script>
</body>
</html>
